<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrcaFind AI | Content Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #020617;
      --sidebar-bg: #0f172a;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 40px;
      background: linear-gradient(135deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-group { margin-bottom: 20px; }
    .nav-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    
    .auth-section { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border); }
    
    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: white;
      margin-bottom: 8px;
      font-size: 14px;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .workspace {
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .header-area { margin-bottom: 32px; }
    .header-area h1 { font-size: 2rem; margin-bottom: 8px; }
    .header-area p { color: var(--text-muted); }

    /* Input Card */
    .glass-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(10px);
    }

    textarea {
      width: 100%;
      height: 160px;
      background: transparent;
      border: none;
      color: white;
      font-size: 16px;
      resize: none;
      outline: none;
      margin-bottom: 20px;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 15px;
      border-top: 1px solid var(--border);
    }

    .btn {
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      border: none;
    }

    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: white; margin-top: 5px; width: 100%; }

    /* Output Grid */
    .output-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 30px;
    }

    .platform-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .platform-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .box { font-size: 14px; line-height: 1.6; color: #cbd5e1; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="logo">OrcaFind.ai</div>
    
    <div class="nav-group">
      <div class="nav-label">Menu</div>
      <button class="btn-outline" style="text-align: left; border: none;">✨ Repurpose</button>
      <button class="btn-outline" style="text-align: left; border: none; opacity: 0.5;">📁 History</button>
    </div>

    <div class="auth-section">
      <div class="nav-label">Account</div>
      <input id="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <button class="btn-primary" style="width: 100%; margin-bottom: 8px;" onclick="handleLogin()">Login</button>
      <button class="btn-outline" onclick="handleSignup()">Sign Up</button>
      <button class="btn-outline" style="color: #ef4444;" onclick="logout()">Logout</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="workspace">
      <div class="header-area">
        <h1>Content Studio</h1>
        <p>Transform your long-form thoughts into high-performing social posts.</p>
      </div>

      <div class="glass-card">
        <textarea id="inputText" placeholder="Paste your article, transcript, or raw thoughts here..."></textarea>
        <div class="action-bar">
          <span style="color: var(--text-muted); font-size: 14px;">AI Model: GPT-4o</span>
          <button id="generateBtn" class="btn btn-primary" onclick="generate()">Generate Posts</button>
        </div>
      </div>

      <div id="output" class="output-grid">
        </div>

      <div style="margin-top: 20px; text-align: right;">
        <button class="btn btn-outline" style="width: auto;" onclick="copyText()">Copy All Results</button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js" defer></script>
</body>
</html>
