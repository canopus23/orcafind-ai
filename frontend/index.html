<!DOCTYPE html>
<html>
<head>
  <title>OrcaFind AI</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e293b, #020617);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .card {
      width: 650px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    p {
      color: #94a3b8;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 140px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #020617;
      color: white;
      resize: none;
      margin-bottom: 15px;
      font-size: 14px;
    }

    textarea:focus {
      outline: none;
      border-color: #3b82f6;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    .output {
      margin-top: 20px;
      background: #020617;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #1e293b;
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 14px;
      color: #e2e8f0;
      max-height: 300px;
      overflow-y: auto;
    }

    .footer {
      margin-top: 15px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>🚀 OrcaFind AI</h1>
    <p>Turn your ideas into viral content in seconds</p>

    <textarea id="inputText" placeholder="Paste your idea, blog, or build update..."></textarea>

    <button onclick="generate()">Generate Content</button>

    <div id="output" class="output"></div>

    <div class="footer">
      Built for devs ⚡
    </div>
  </div>

  <script>
    async function generate() {
      const text = document.getElementById("inputText").value;
      const button = document.querySelector("button");
      const output = document.getElementById("output");

      button.innerText = "Generating...";
      button.disabled = true;
      output.innerText = "⏳ Generating content...";

      try {
        const response = await fetch("http://127.0.0.1:8000/repurpose/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ text })
        });

        const data = await response.json();
        output.innerText = data.result;

      } catch (error) {
        output.innerText = "❌ Something went wrong.";
      }

      button.innerText = "Generate Content";
      button.disabled = false;
    }
  </script>

</body>
</html>
