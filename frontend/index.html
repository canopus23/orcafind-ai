<!DOCTYPE html>
<html>
<head>
  <title>OrcaFind AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      background: radial-gradient(circle at top, #1e293b, #020617);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      color: white;
    }

    .card {
      width: 700px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    textarea {
      width: 100%;
      height: 140px;
      padding: 12px;
      border-radius: 10px;
      background: #020617;
      color: white;
      border: 1px solid #334155;
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid #334155;
      background: #020617;
      color: white;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 5px;
    }

    .box {
      margin-top: 10px;
      padding: 15px;
      background: #020617;
      border-radius: 10px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>OrcaFind AI</h2>

    <input id="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />

    <button onclick="handleSignup()">Sign Up</button>
    <button onclick="handleLogin()">Login</button>
    <button onclick="logout()">Logout</button>

    <hr>

    <textarea id="inputText" placeholder="Paste your content..."></textarea>

    <button id="generateBtn" onclick="generate()">Generate</button>

    <div id="output"></div>

    <button onclick="copyText()">Copy</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    async function handleSignup() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { error } = await supabase.auth.signUp({ email, password });

      if (error) alert(error.message);
      else alert("Check your email to confirm");
    }

    async function handleLogin() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const { error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) alert(error.message);
      else alert("Logged in");
    }

    async function logout() {
      await supabase.auth.signOut();
      alert("Logged out");
    }

    async function generate() {
      const text = document.getElementById("inputText").value;
      const button = document.getElementById("generateBtn");
      const output = document.getElementById("output");

      const { data: { session } } = await supabase.auth.getSession();

      if (!session) {
        alert("Please login first");
        return;
      }

      const token = session.access_token;

      if (!text.trim()) {
        alert("Enter content");
        return;
      }

      button.innerText = "Generating...";
      button.disabled = true;
      output.innerHTML = "Generating...";

      try {
        const response = await fetch("https://api.orcafind.com/repurpose/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ text })
        });

        if (!response.ok) {
          const err = await response.json();
          output.innerHTML = err.detail;
          return;
        }

        const data = await response.json();
        const parts = data.result.split("LinkedIn");

        output.innerHTML = `
          <h3>Twitter</h3>
          <div class="box">${parts[0]}</div>

          <h3>LinkedIn</h3>
          <div class="box">${parts[1] || ""}</div>
        `;

      } catch {
        output.innerHTML = "Error occurred";
      }

      button.innerText = "Generate";
      button.disabled = false;
    }

    function copyText() {
      const text = document.getElementById("output").innerText;
      navigator.clipboard.writeText(text);
    }
  </script>

</body>
</html>
