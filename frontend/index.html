<!DOCTYPE html>
<html>
<head>
  <title>OrcaFind AI</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    .container {
      width: 600px;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .output {
      margin-top: 20px;
      background: #1e293b;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🚀 OrcaFind AI</h1>
    <p>Turn your ideas into content</p>

    <textarea id="inputText" placeholder="Paste your idea or blog..."></textarea>

    <button onclick="generate()">Generate</button>

    <div id="output" class="output"></div>
  </div>

 <script>
async function generate() {
  const text = document.getElementById("inputText").value;
  const button = document.querySelector("button");
  const output = document.getElementById("output");

  // 🟡 Start loading
  button.innerText = "Generating...";
  button.disabled = true;
  output.innerText = "⏳ Generating content...";

  try {
    const response = await fetch("http://127.0.0.1:8000/repurpose/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ text })
    });

    const data = await response.json();

    // ✅ Show result
    output.innerText = data.result;

  } catch (error) {
    output.innerText = "❌ Something went wrong. Try again.";
  }

  // 🔵 Reset button
  button.innerText = "Generate";
  button.disabled = false;
}
</script>
</body>
</html>
