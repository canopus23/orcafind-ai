<!DOCTYPE html>
<html>
<head>
  <title>OrcaFind AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      background: radial-gradient(circle at top, #1e293b, #020617);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      color: white;
    }

    .card {
      width: 700px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    textarea {
      width: 100%;
      height: 140px;
      padding: 12px;
      border-radius: 10px;
      background: #020617;
      color: white;
      border: 1px solid #334155;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 5px;
    }

    .box {
      margin-top: 10px;
      padding: 15px;
      background: #020617;
      border-radius: 10px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>🚀 OrcaFind AI</h2>

    <textarea id="inputText" placeholder="Paste your content..."></textarea>

    <button id="generateBtn" onclick="generate()">Generate</button>

    <div id="output"></div>

    <button onclick="copyText()">Copy</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
