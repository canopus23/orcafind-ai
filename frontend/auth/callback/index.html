<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>OrcaFind AI | Signing in…</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #070b14;
      --surface: rgba(10, 16, 28, 0.78);
      --surface-strong: rgba(6, 10, 18, 0.86);
      --ink: rgba(245, 250, 255, 0.92);
      --muted: rgba(185, 200, 221, 0.74);
      --line: rgba(255, 255, 255, 0.10);
      --shadow-xl: 0 30px 90px rgba(0, 0, 0, 0.5);
      --radius-xl: 28px;
      --page-width: 960px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(19, 103, 255, 0.22), transparent 38%),
        radial-gradient(circle at top right, rgba(10, 181, 255, 0.14), transparent 36%),
        linear-gradient(180deg, #050814 0%, #070b14 40%, #040610 100%);
    }
    .shell { padding: 32px 0 60px; display: grid; place-items: center; }
    .card {
      width: min(560px, calc(100% - 28px));
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      backdrop-filter: blur(18px);
      padding: 22px;
    }
    .card-head { display: grid; gap: 10px; }
    .card-head h1 { font-size: 1.7rem; letter-spacing: -0.03em; }
    .muted { color: var(--muted); line-height: 1.65; font-weight: 600; }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-label="Signing in">
      <div class="card-head">
        <h1>Signing you in…</h1>
        <p class="muted">Finishing authentication. You’ll be redirected automatically.</p>
      </div>
    </section>
  </main>

  <script src="/vendor/supabase-js-2.105.1.umd.min.js" defer></script>
  <script src="/config.js" defer></script>
  <script src="/analytics.js" defer></script>
  <script src="/theme.js" defer></script>
  <script src="/loader.js" defer></script>
  <script src="/script.js" defer></script>
</body>
</html>
